name: bridge-source-ci

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check host tests and example sources
        run: |
          python3 -I -m compileall -q tests
          python3 -I -m compileall -q examples
          test -s examples/PhoneMatrix/PhoneMatrix.ino
          git diff --check
