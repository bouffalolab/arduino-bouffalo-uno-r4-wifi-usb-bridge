name: bridge-explorer-pages

on:
  push:
    branches: [master]
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'examples/PhoneMatrix/PhoneMatrix.ino'
  pull_request:
    paths:
      - 'site/**'
      - '.github/workflows/pages.yml'
      - 'examples/PhoneMatrix/PhoneMatrix.ino'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check lesson data and PhoneMatrix contract
        run: node --test site/tests/*.test.js
      - name: Check scripts and whitespace
        run: |
          for source in site/assets/*.js; do node --check "$source"; done
          git diff --check
      - name: Stage public site only
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p "$RUNNER_TEMP/site/assets"
          cp site/index.html "$RUNNER_TEMP/site/"
          cp site/assets/* "$RUNNER_TEMP/site/assets/"
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/site

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/master'
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
