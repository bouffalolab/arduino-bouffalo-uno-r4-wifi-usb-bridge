# OpenOCD 0.11.0-arduino2: BL616CL CMSIS-DAP v1 over vendor HID.
# This config provides debug/memory access. Use pyOCD for flash programming.
source [find interface/cmsis-dap.cfg]
cmsis_dap_vid_pid 0x349b 0x0011
cmsis_dap_backend hid
transport select swd
source [find target/swj-dp.tcl]
swj_newdap ra4m1 cpu -irlen 4 -expected-id 0x5ba02477
dap create ra4m1.dap -chain-position ra4m1.cpu
target create ra4m1.cpu cortex_m -dap ra4m1.dap
cortex_m reset_config sysresetreq
adapter speed 100
